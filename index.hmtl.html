<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reto en clase: Venn, tierra y trigonometría</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--c1:#E8895A;--c2:#D9A23F;--bg:#FFF4E6;--card:#FFFCF7;--ink:#3A2A22;--mute:#7A6355;--line:#EBD6BF;--ok:#4C9A55;--bad:#CC4B33;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2B201B;--card:#3A2C25;--ink:#FBEFE3;--mute:#D2BBA8;--line:#5A4538}}
:root[data-theme="dark"]{--bg:#2B201B;--card:#3A2C25;--ink:#FBEFE3;--mute:#D2BBA8;--line:#5A4538}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;color:var(--ink);font:800 17px/1.4 Nunito,system-ui,sans-serif;min-height:100vh;background:linear-gradient(160deg,color-mix(in srgb,var(--c1) 30%,var(--bg)),var(--bg) 45%,color-mix(in srgb,var(--c2) 22%,var(--bg)))}
main{max-width:560px;margin:0 auto;padding:18px 16px 32px}
h1,h2,.btn,.big,.bar{font-family:Fredoka,system-ui,sans-serif}
h1{font-size:34px;line-height:1.1;margin:6px 0 8px}
h2{font-size:21px;margin:0 0 4px;line-height:1.25;font-weight:700}
p{margin:0 0 12px;color:var(--mute);font-weight:600}
.hero{font-size:72px;line-height:1;text-align:center;margin-top:8px}
.card{background:var(--card);border:3px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px}
input{width:100%;font:inherit;font-size:20px;padding:14px;border-radius:14px;border:3px solid var(--line);background:var(--card);color:var(--ink);margin-bottom:12px}
.btn{display:block;width:100%;background:linear-gradient(90deg,var(--c1),var(--c2));color:#fff;border:0;border-radius:14px;padding:14px;font-size:20px;font-weight:700;cursor:pointer;min-height:54px;margin-bottom:10px}
.btn.ghost{background:var(--card);color:var(--ink);border:3px solid var(--line)}
.bar{display:flex;justify-content:space-between;align-items:center;font-size:18px;font-weight:700;margin-bottom:8px}
.track{height:12px;background:var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px}
#tfill{height:100%;width:100%;background:var(--ok);transition:width .1s linear,background .3s}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:0;border-radius:14px;padding:13px 14px;margin:0 0 10px;font:inherit;color:#fff;cursor:pointer;min-height:56px}
.opt i{font:700 18px Fredoka,sans-serif;font-style:normal;background:rgba(255,255,255,.28);border-radius:8px;width:32px;height:32px;flex:none;display:grid;place-items:center}
.k0{background:#CF5B3F}.k1{background:#B87420}.k2{background:#6F8A3A}.k3{background:#9D4F73}
.opt:active{transform:scale(.98)}
.opt:disabled{cursor:default;opacity:.45}
.opt.ok{opacity:1;outline:4px solid var(--ink)}
.opt.bad{opacity:.45;text-decoration:line-through}
.fb{border-radius:14px;padding:12px 14px;margin:4px 0 14px;background:var(--card);border:3px solid var(--line)}
.fb .tt{display:block;font:700 22px Fredoka,sans-serif;margin-bottom:4px}
.fb.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card))}
.fb.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--card))}
.big{font-size:64px;line-height:1;text-align:center;margin:6px 0}
.row{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;margin-bottom:6px;background:var(--card);border:2px solid var(--line)}
.row.r0{background:#F7D774;border-color:#D9A920;color:#3A2A22}.row.r1{background:#E6E2DD;border-color:#B5AEA6;color:#3A2A22}.row.r2{background:#EDB98A;border-color:#C8814A;color:#3A2A22}
.row.me{border-color:var(--c2);background:color-mix(in srgb,var(--c2) 14%,var(--card))}
.row b:first-child{width:34px;font:700 20px Fredoka,sans-serif}
.row .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
svg{display:block;margin:0 auto 10px;max-width:100%}
.hide{display:none}
:focus-visible{outline:3px solid var(--c2);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
<section id="s0">
  <div class="hero">🎯</div>
  <h1 style="text-align:center">Reto en clase</h1>
  <p style="text-align:center">Escribe tu nombre, elige un tema y responde antes de que se acabe el tiempo.</p>
  <div class="card">
    <label for="nm" style="display:block;margin-bottom:6px">Tu nombre</label>
    <input id="nm" maxlength="16" placeholder="Escribe tu nombre" autocomplete="off">
    <div id="tops"></div>
  </div>
</section>
<section id="s1" class="hide">
  <div class="bar"><span id="who"></span><span id="pts">0 pts</span></div>
  <div class="bar" style="font-size:15px"><span id="cnt"></span><span id="tl"></span></div>
  <div class="track"><div id="tfill"></div></div>
  <div class="card"><div id="art"></div><h2 id="q"></h2></div>
  <div id="opts"></div>
  <div id="fb" class="fb hide"></div>
  <button class="btn hide" id="next">Siguiente</button>
</section>
<section id="s2" class="hide">
  <div class="card" style="text-align:center">
    <p id="hit" style="margin:0"></p>
    <div class="big" id="score"></div>
    <p id="msg" style="margin:0"></p>
  </div>
  <button class="btn" id="copy">Copiar mi resultado</button>
  <button class="btn ghost" id="again">Jugar este tema otra vez</button>
  <button class="btn ghost" id="home">Elegir otro tema</button>
</section>
</main>
<script>
const TOPICS=[{"title": "Unión e intersección", "emoji": "🔵", "c1": "#E8895A", "c2": "#E6B04B", "qs": [{"q": "¿Qué es el espacio muestral S?", "o": ["El conjunto de todos los resultados posibles", "Un solo evento", "Solo los resultados favorables", "El símbolo de la unión"], "e": "S es el rectángulo que contiene todos los resultados posibles."}, {"q": "¿Qué región está sombreada?", "v": "ab", "o": ["A ∩ B", "A ∪ B", "A − B", "B − A"], "e": "La zona donde los círculos se cruzan cumple A y B a la vez."}, {"q": "En el dado, A = pares {2, 4, 6} y B = mayores que 3 {4, 5, 6}. ¿Cuánto es A ∩ B?", "o": ["{4, 6}", "{2, 4, 5, 6}", "{2}", "{1, 3}"], "e": "Son los números que están en A y también en B: el 4 y el 6."}, {"q": "¿Qué región está sombreada?", "v": "u", "o": ["A ∪ B", "A ∩ B", "Solo B", "Fuera de A y B"], "e": "Todo lo que cubren los dos círculos es la unión: A o B o ambos."}, {"q": "Si dos eventos son mutuamente excluyentes, ¿cuánto es P(A ∪ B)?", "o": ["P(A) + P(B)", "P(A) · P(B)", "P(A) − P(B)", "1"], "e": "Sus círculos no se tocan, así que no hay intersección que restar."}, {"q": "Con el dado, ¿cuánto es P(A ∪ B)? (A = pares, B = mayores que 3)", "o": ["2/3", "1/2", "5/6", "1/3"], "e": "3/6 + 3/6 − 2/6 = 4/6 = 2/3."}, {"q": "En un curso de 40, 25 juegan fútbol, 18 natación y 8 ambos. ¿Cuántos no hacen ninguno?", "o": ["5", "7", "3", "8"], "e": "17 solo fútbol + 10 solo natación + 8 ambos = 35. Y 40 − 35 = 5."}, {"q": "En una baraja de 52, A = corazones y B = figuras (J, Q, K). ¿Cuánto es P(A ∩ B)?", "o": ["3/52", "12/52", "13/52", "22/52"], "e": "Solo hay 3 figuras de corazones: J, Q y K de corazones."}]}, {"title": "Conflictos por la tierra", "emoji": "🌎", "c1": "#D9A23F", "c2": "#C9694B", "qs": [{"q": "¿Qué significa territorio en este tema?", "o": ["Un espacio con significado social, cultural y político", "Solo un terreno vacío", "Únicamente una finca", "Un mapa de carreteras"], "e": "El territorio es el espacio donde se vive, se produce y se construye identidad."}, {"q": "¿Cuál es una raíz histórica de la concentración de la tierra en América Latina?", "o": ["Las encomiendas y las grandes haciendas coloniales", "La llegada del internet", "Las reformas urbanas del siglo XXI", "La creación de los parques"], "e": "En la Conquista y la Colonia se repartieron grandes extensiones a pocos dueños."}, {"q": "¿Qué mide el índice de Gini de la tierra?", "o": ["Qué tan desigual es su distribución", "El precio de la tierra", "La cantidad de lluvias", "El número de cultivos"], "e": "Entre más alto, más concentrada está la tierra en pocas manos."}, {"q": "¿Qué actor suele tener intereses extractivos sobre el territorio?", "o": ["Empresas mineras y petroleras", "Familias campesinas", "Escuelas rurales", "Juntas de acción comunal"], "e": "Minería, petróleo y megaproyectos compiten con comunidades por el uso del suelo."}, {"q": "¿Cómo influye la informalidad de los títulos en los conflictos?", "o": ["Genera inseguridad y facilita el despojo", "Resuelve todos los conflictos", "No tiene efecto", "Reduce la violencia"], "e": "Sin título claro, es más fácil perder la tierra."}, {"q": "¿Qué es el punto 1 del Acuerdo de Paz de 2016?", "o": ["La Reforma Rural Integral", "La reforma pensional", "El servicio militar", "El libre comercio"], "e": "Trata del acceso a la tierra y el desarrollo del campo."}, {"q": "¿Cuál es una consecuencia de la desigualdad en la tierra?", "o": ["Pobreza rural y migración a las ciudades", "Más soberanía alimentaria", "Menos deforestación", "Más equidad rural"], "e": "Sin tierra suficiente, muchas familias deben dejar el campo."}, {"q": "¿Para qué sirve un catastro multipropósito?", "o": ["Para conocer y formalizar quién es dueño de qué tierra", "Para cobrar peajes", "Para medir el clima", "Para construir carreteras"], "e": "Es una herramienta clave para ordenar y formalizar la propiedad."}]}, {"title": "Razones trigonométricas", "emoji": "📐", "c1": "#D9748A", "c2": "#E59B57", "qs": [{"q": "¿De qué depende una razón trigonométrica?", "o": ["Solo del ángulo, no del tamaño del triángulo", "Del color del triángulo", "Del área", "Del perímetro"], "e": "Si el triángulo se agranda, los lados cambian pero la razón se mantiene."}, {"q": "¿Cuál es la hipotenusa?", "o": ["El lado opuesto al ángulo recto y el más largo", "El cateto más corto", "El lado adyacente a θ", "La altura"], "e": "Siempre es el lado más largo del triángulo rectángulo."}, {"q": "¿Cuánto es sen θ?", "o": ["Cateto opuesto / hipotenusa", "Cateto adyacente / hipotenusa", "Cateto opuesto / cateto adyacente", "Hipotenusa / opuesto"], "e": "SOH: Seno = Opuesto / Hipotenusa."}, {"q": "En SOH-CAH-TOA, ¿qué significa CAH?", "o": ["Coseno = Adyacente / Hipotenusa", "Coseno = Opuesto / Adyacente", "Cateto = Altura / Hipotenusa", "Cosecante = Adyacente / Hipotenusa"], "e": "CAH: Coseno = Adyacente / Hipotenusa."}, {"q": "¿Cuánto es la cosecante, csc θ?", "o": ["Hipotenusa / cateto opuesto", "Hipotenusa / cateto adyacente", "Cateto opuesto / hipotenusa", "Adyacente / opuesto"], "e": "Es la recíproca del seno: csc θ = 1 / sen θ."}, {"q": "Catetos 3 y 4, hipotenusa 5. ¿Cuánto es tan del ángulo opuesto al cateto 3?", "o": ["3/4", "3/5", "4/5", "4/3"], "e": "Tangente = opuesto / adyacente = 3/4."}, {"q": "Una escalera de 6 m forma 60° con el suelo. ¿Qué altura alcanza? (sen 60° ≈ 0,866)", "o": ["≈ 5,2 m", "≈ 3 m", "≈ 6,9 m", "≈ 10,4 m"], "e": "h = 6 · sen 60° ≈ 5,2 m."}, {"q": "Un árbol de 8 m proyecta una sombra de 10 m. ¿Cuánto mide el ángulo de elevación del sol?", "o": ["≈ 38,7°", "≈ 51,3°", "≈ 45°", "≈ 80°"], "e": "tan θ = 8/10 = 0,8 y θ = tan⁻¹(0,8) ≈ 38,7°."}]}], SEC=20, $=id=>document.getElementById(id);
let t=0,name="",order=[],i=0,pts=0,streak=0,right=0,left=SEC,tm=null,res="";
const shuffle=a=>{a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};
const show=id=>{["s0","s1","s2"].forEach(s=>$(s).classList.toggle("hide",s!==id));scrollTo(0,0)};
const R=document.documentElement.style;
try{$("nm").value=localStorage.getItem("nm")||""}catch(e){}
TOPICS.forEach((p,k)=>{const b=document.createElement("button");b.className="btn";b.style.background="linear-gradient(90deg,"+p.c1+","+p.c2+")";b.textContent=p.emoji+"  "+p.title;b.onclick=()=>start(k);$("tops").appendChild(b)});
function venn(v){
  const on="var(--c1)",st="stroke='var(--ink)' stroke-width='2'";
  let s="<svg viewBox='0 0 200 120' width='230' role='img' aria-label='Diagrama de Venn con una región sombreada'><defs><clipPath id='cA'><circle cx='78' cy='60' r='44'/></clipPath></defs><rect x='2' y='2' width='196' height='116' rx='10' fill='var(--card)' stroke='var(--line)' stroke-width='2'/>";
  const off="color-mix(in srgb,var(--c1) 18%,var(--card))";
  if(v=="ab")s+=`<circle cx='78' cy='60' r='44' fill='${off}'/><circle cx='122' cy='60' r='44' fill='${off}'/><circle cx='122' cy='60' r='44' fill='${on}' clip-path='url(#cA)'/>`;
  if(v=="u")s+=`<circle cx='78' cy='60' r='44' fill='${on}'/><circle cx='122' cy='60' r='44' fill='${on}'/>`;
  return s+`<circle cx='78' cy='60' r='44' fill='none' ${st}/><circle cx='122' cy='60' r='44' fill='none' ${st}/><text x='46' y='64' font-size='16' font-weight='700' fill='var(--ink)'>A</text><text x='144' y='64' font-size='16' font-weight='700' fill='var(--ink)'>B</text></svg>`;
}
function start(k){
  name=$("nm").value.trim().slice(0,16);
  if(!name){$("nm").focus();$("nm").style.borderColor="var(--bad)";return}
  try{localStorage.setItem("nm",name)}catch(e){}
  t=k;R.setProperty("--c1",TOPICS[k].c1);R.setProperty("--c2",TOPICS[k].c2);
  order=shuffle(TOPICS[k].qs);i=0;pts=0;streak=0;right=0;
  $("who").textContent=name+" · "+TOPICS[k].title;show("s1");render();
}
function render(){
  const q=order[i];
  $("cnt").textContent="Pregunta "+(i+1)+" de "+order.length;$("pts").textContent=pts+" pts";
  $("art").innerHTML=q.v?venn(q.v):"";$("q").textContent=q.q;
  $("fb").className="fb hide";$("next").classList.add("hide");$("opts").innerHTML="";
  shuffle(q.o).forEach((o,k)=>{
    const b=document.createElement("button");b.className="opt k"+k;
    const l=document.createElement("i");l.textContent="ABCD"[k];
    const t=document.createElement("span");t.textContent=o;b.append(l,t);
    b.onclick=()=>answer(b,o===q.o[0]);$("opts").appendChild(b)});
  left=SEC;tick();clearInterval(tm);
  tm=setInterval(()=>{left-=.1;tick();if(left<=0){clearInterval(tm);answer(null,false,true)}},100);
}
function tick(){
  const p=Math.max(0,left/SEC*100);
  $("tfill").style.width=p+"%";$("tfill").style.background=p>50?"var(--ok)":p>25?"#E3A63B":"var(--bad)";
  $("tl").textContent="⏱ "+Math.max(0,Math.ceil(left))+" s";
}
function answer(btn,ok,timeout){
  clearInterval(tm);const q=order[i];
  [...$("opts").children].forEach(b=>{b.disabled=true;if(b.textContent===q.o[0]){b.disabled=false;b.classList.add("ok")}else if(b===btn)b.classList.add("bad")});
  let m;
  if(ok){streak++;right++;const g=100+Math.round(left*5)+(streak>1?(streak-1)*20:0);pts+=g;m="✅ ¡Correcta! +"+g+" pts"+(streak>1?" · racha de "+streak:"")}
  else{streak=0;m=timeout?"⏰ Tiempo agotado: respuesta incorrecta":"❌ Incorrecta"}
  $("fb").innerHTML="";$("fb").className="fb "+(ok?"ok":"bad");const b=document.createElement("b");b.className="tt";b.textContent=m;$("fb").append(b);if(!ok){const c=document.createElement("div");c.textContent="Respuesta correcta: "+q.o[0];c.style.marginBottom="4px";$("fb").append(c)}$("fb").append(document.createTextNode(q.e));
  $("pts").textContent=pts+" pts";
  $("next").textContent=i===order.length-1?"Ver resultado":"Siguiente";$("next").classList.remove("hide");$("next").focus();
}
$("next").onclick=()=>{i++;i<order.length?render():finish()};
function finish(){
  $("score").textContent=pts;$("hit").textContent=name+": "+right+" de "+order.length+" correctas";
  $("msg").textContent=right===order.length?"¡Perfecto! Dominas este tema. 🎉":right>=6?"¡Muy bien! Casi perfecto.":"Buen intento. ¡Repasa y juega otra vez!";
  res=name+" - "+TOPICS[t].title+": "+pts+" puntos ("+right+"/"+order.length+" correctas)";
  $("copy").textContent="Copiar mi resultado";show("s2");
}
$("copy").onclick=()=>{
  const ok=()=>$("copy").textContent="¡Copiado! Envíaselo a tu profe";
  if(navigator.clipboard)navigator.clipboard.writeText(res).then(ok,()=>{$("copy").textContent=res});else $("copy").textContent=res};
$("again").onclick=()=>start(t);
$("home").onclick=()=>{R.setProperty("--c1","#E8895A");R.setProperty("--c2","#D9A23F");show("s0")};
$("nm").onkeydown=e=>{if(e.key==="Enter")$("nm").blur()};
</script>
</body>
</html>
